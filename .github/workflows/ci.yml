# Phase 26A.6 — every push and PR runs `npm run check` on GitHub.
# A red check here means: do not merge, nothing ships.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

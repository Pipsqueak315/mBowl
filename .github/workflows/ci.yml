# Phase 26A.6 — every push and PR runs `npm run check` on GitHub.
# A red check here means: do not merge, nothing ships.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # v2.1 P39 (Nov 24): ESLint, report-only for now. Lists react-hooks issues,
      # including the patterns that make React Compiler skip a component.
      # It does not fail the build yet; make it a gate once the list is clean.
      - name: Lint (report only)
        continue-on-error: true
        run: npx eslint . --format stylish
